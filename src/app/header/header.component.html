<nav class="navbar navbar-default rb-navbar">
  <div class="container-fluid">
    <div class="navbar-header">
      <button
        type="button"
        class="navbar-toggle"
        (click)="collapsed = !collapsed"
      >
        <span class="rb-sr-only">Toggle navigation</span>
        <span class="icon-bar" *ngFor="let iconBar of [1, 2, 3]"></span>
      </button>
      <a routerLink="/" class="navbar-brand rb-brand">
        <span class="rb-brand__mark" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
            <path
              d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"
            />
          </svg>
        </span>
        <span class="rb-brand__text">Recipe<b>Book</b></span>
      </a>
    </div>

    <div
      class="navbar-collapse"
      [class.collapse]="collapsed"
      (window:resize)="collapsed = true"
    >
      <ul class="nav navbar-nav">
        <li routerLinkActive="active" *ngIf="isAuthenticated">
          <a [routerLink]="['/recipes']">
            <svg
              class="rb-nav-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
              <path
                d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"
              />
            </svg>
            Recipes
          </a>
        </li>
        <li routerLinkActive="active">
          <a [routerLink]="['/shopping-list']">
            <svg
              class="rb-nav-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="9" cy="21" r="1" />
              <circle cx="20" cy="21" r="1" />
              <path
                d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"
              />
            </svg>
            Shopping List
          </a>
        </li>
        <li routerLinkActive="active" *ngIf="!isAuthenticated">
          <a [routerLink]="['/auth']">
            <svg
              class="rb-nav-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
              <polyline points="10 17 15 12 10 7" />
              <line x1="15" y1="12" x2="3" y2="12" />
            </svg>
            Sign in
          </a>
        </li>
      </ul>

      <ul class="nav navbar-nav navbar-right">
        <li class="rb-user" *ngIf="isAuthenticated">
          <span class="rb-avatar">{{ userInitial }}</span>
          <span class="rb-user__email hidden-xs hidden-sm">{{ userEmail }}</span>
          <span
            class="rb-role-chip"
            [class.rb-role-chip--admin]="isAdmin"
            [class.rb-role-chip--view]="!isAdmin"
            >{{ roleLabel }}</span
          >
        </li>
        <li class="dropdown" appDropdown *ngIf="isAuthenticated">
          <a class="dropdown-toggle rb-click" role="button">
            <svg
              class="rb-nav-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="4" y1="21" x2="4" y2="14" />
              <line x1="4" y1="10" x2="4" y2="3" />
              <line x1="12" y1="21" x2="12" y2="12" />
              <line x1="12" y1="8" x2="12" y2="3" />
              <line x1="20" y1="21" x2="20" y2="16" />
              <line x1="20" y1="12" x2="20" y2="3" />
              <line x1="1" y1="14" x2="7" y2="14" />
              <line x1="9" y1="8" x2="15" y2="8" />
              <line x1="17" y1="16" x2="23" y2="16" />
            </svg>
            Manage <span class="caret"></span>
          </a>
          <ul class="dropdown-menu">
            <li *ngIf="isAdmin">
              <a class="rb-click" (click)="onSaveData()">Save to cloud</a>
            </li>
            <li class="divider" *ngIf="isAdmin"></li>
            <li>
              <a class="rb-click" (click)="onFetchData()">Fetch from cloud</a>
            </li>
          </ul>
        </li>
        <li *ngIf="isAuthenticated">
          <a class="rb-logout rb-click" (click)="onLogout()">
            <svg
              class="rb-nav-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <polyline points="16 17 21 12 16 7" />
              <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
            Logout
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>
